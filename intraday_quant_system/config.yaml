zerodha:
  api_key: "${KITE_API_KEY}"
  api_secret: "${KITE_API_SECRET}"

database:
  timescaledb_url: "${TIMESCALEDB_URL}"
  redis_url: "${REDIS_URL}"

trading:
  universe: 
    - "RELIANCE.NS"
    - "HDFCBANK.NS"
    - "TCS.NS"
    - "INFY.NS"
    - "ICICIBANK.NS"
    - "SBIN.NS"
    - "TATAMOTORS.NS"
    - "WIPRO.NS"
    - "BAJFINANCE.NS"
    - "LT.NS"
    - "HCLTECH.NS"
    - "BHARTIARTL.NS"
    - "AXISBANK.NS"
    - "KOTAKBANK.NS"
    - "MARUTI.NS"
    - "SUNPHARMA.NS"
    - "TITAN.NS"
    - "ULTRACEMCO.NS"
    - "ADANIENT.NS"
    - "NTPC.NS"
    - "POWERGRID.NS"
    - "ONGC.NS"
    - "COALINDIA.NS"
    - "JSWSTEEL.NS"
    - "TATASTEEL.NS"
    - "TECHM.NS"
    - "INDUSINDBK.NS"
    - "HINDALCO.NS"
    - "DRREDDY.NS"
    - "CIPLA.NS"
  target_volatility: 0.15
  max_capital: 100000.0
  trading_start: "09:15"
  trading_end: "15:30"
  retraining_frequency: "weekly"

# Success metrics — minimum thresholds for production go-live
success_metrics:
  min_sharpe_ratio: 1.0
  max_drawdown_pct: 0.10
  min_win_rate: 0.50
  min_profit_factor: 1.3
  min_walk_forward_splits_passing: 0.70  # 70% of WF splits must be positive

# NSE Intraday transaction costs (Zerodha / discount broker)
transaction_costs:
  brokerage_pct: 0.0003        # 3 bps (Zerodha intraday)
  stt_sell_pct: 0.00025        # STT on sell side only
  exchange_txn_pct: 0.0000345  # NSE transaction charge
  gst_pct: 0.18               # 18% GST on brokerage
  sebi_turnover_pct: 0.000001  # SEBI turnover fee
  stamp_duty_buy_pct: 0.00003  # Stamp duty on buy side
  estimated_slippage_pct: 0.0003  # 3 bps avg slippage
  slippage_large_cap_pct: 0.0002
  slippage_mid_cap_pct: 0.0005
  slippage_small_cap_pct: 0.001

# Risk parameters
risk:
  max_risk_per_trade: 0.02     # 2% of capital
  max_open_positions: 5
  max_sector_exposure: 0.25    # 25%
  max_portfolio_exposure: 0.70 # 70%
  min_cash_reserve: 0.30       # 30%
  daily_loss_limit: 0.03       # 3% — triggers kill switch
  weekly_loss_limit: 0.06      # 6% — reduces size 50%
  max_drawdown_limit: 0.10     # 10% — pause for review
  vix_cutoff: 25               # VIX > 25 — cut exposure

# NSE Intraday timing (15-minute bars)
intraday:
  bars_per_day: 25             # 15-min bars from 9:15 to 15:30
  bars_per_year: 6250          # 25 bars × 250 trading days
  no_new_trades_after: "14:30" # No new calls after 2:30 PM
  begin_closing: "15:00"       # Start squaring off at 3:00 PM
  hard_exit: "15:10"           # All positions must be flat by 3:10 PM

# Model parameters
models:
  lgbm:
    num_leaves: 63             # Reduced from 127 to limit overfitting
    learning_rate: 0.03
    n_estimators: 2000         # Higher but with early stopping
    early_stopping_rounds: 50
    feature_fraction: 0.7
    bagging_fraction: 0.8
    min_child_samples: 100
  catboost:
    iterations: 800
    learning_rate: 0.05
    depth: 5
    early_stopping_rounds: 50
    l2_leaf_reg: 10.0
  transformer:
    embed_dim: 64
    nhead: 4
    num_layers: 3
    seq_len: 120
    epochs: 100
    patience: 10
